[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
# 分发包名的单一声明处（PRD FR-1）：PyPI/Homebrew 分发名是 kedacode，
# CLI 入口名仍是 iar（装 kedacode、敲 iar）。改名时穷举命令见 PRD 7.5 第 3 条。
name = "kedacode"
version = "0.2.0"
description = "Issue Agent Runner (iar) — turn GitHub Issues into a local AI agent queue."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "zata"},
]
keywords = ["ai-agent", "clean-architecture", "monorepo-template", "issue-runner", "git-worktree"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Typing :: Typed",
]
# 依赖分组原则（FR-11 / PRD 决策二）：默认依赖只保留 console / CLI / daemon
# 主路径真正 import 的包；云 SDK 与数据库驱动按使用场景收进 extras，
# README「安装」一节说明各自何时需要。
dependencies = [
    "croniter>=3.0.0",
    "fastapi>=0.115.0",
    "pre-commit>=4.5.1",
    "psutil>=7.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
    "tomli-w>=1.0.0",
    "tomlkit>=0.15.0",
    "typer>=0.26.7",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
iar = "backend.api.cli:main"

[project.optional-dependencies]
llm = [
    "langchain-anthropic>=0.1.0",
    "langchain-core>=1.2.7",
    "langchain-openai>=0.1.0",
]
db = [
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
]
backup = [
    "boto3>=1.37.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"backend.engines.agent_runner.templates" = ["**/*"]
"backend.api.static" = ["console/**/*"]

[dependency-groups]
dev = [
    # extras 里的可选依赖在仓库开发/测试环境照常可用（不属于 wheel 默认依赖）。
    "alembic>=1.18.4",
    "boto3>=1.37.0",
    "langchain-core>=1.2.7",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
    "pre-commit>=4.5.1",
    "pylint>=3.2.0",
    "pytest>=8.3.0",
    "pytest-testmon>=2.1.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocs-git-revision-date-localized-plugin>=1.4.5",
    "mkdocstrings[python]>=0.30.0",
    "pymdown-extensions>=10.14",
    "socksio>=1.0.0",
]

# 上游模板仓 zata-codes-template 另有独立的 pytest.ini 与 ruff.toml。keda 刻意
# 不采用它们:独立配置文件的优先级**高于** pyproject.toml 的对应段落,一旦落地会
# 静默顶掉下面这两块。具体冲突:模板 pytest.ini 的
# `addopts = -m 'not slow and not real_api and not redis' -n auto --dist=loadgroup`
# 会覆盖 `--testmon` 增量模式并引入 xdist 并行;模板 ruff.toml 会整体接管 lint 规则集。
# `sync_template.sh --list` 会持续把这两个文件报为 NEW,那是预期的,不是漏同步。
# 要改用模板版本,必须同时删掉这里的对应段落并重跑全量测试确认行为一致。
[tool.pytest.ini_options]
addopts = "--testmon"

[tool.ruff]
target-version = "py311"
line-length = 100
