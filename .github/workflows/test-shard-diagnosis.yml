# 一次性诊断用。定位后删掉本文件。
#
# 三轮收敛的结果：
#   1. 8 个连续分片并行跑 → 只有 shard 6（排序后第 76-90 个文件）挂住；
#   2. 15 个文件塞进一个 job 顺序跑 → 我限了单文件 180 秒却没限总和，最坏 45 分钟，
#      step 跑满 30 分钟被取消，日志第七次没拿到；
#   3. 一个文件一个 job → 14 个全绿，只有 tests/test_process_runner.py 挂住，
#      而且连 `timeout --signal=KILL 300` 都没能让步骤结束。
#
# 所以这一轮把粒度降到单个用例。贯穿始终真正奏效的取证方式只有一种：
# **让 job 本身承载信号**——挂住的那个显示为 cancelled，其余正常完成，
# 结论完全不依赖能否从挂住的 run 里抠出日志。job 名就是答案。
name: Test shard diagnosis (manual)

on:
  workflow_dispatch:

env:
  SUSPECT_FILE: tests/test_process_runner.py

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.list.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --all-extras --all-groups --frozen
      - id: list
        name: Collect the node ids
        run: |
          # 只取 `::` 之后的用例名，这样 job 名短到能在列表里一眼读完——
          # job 名就是本次诊断的输出，可读性即结论可读性。
          tests_json="$(uv run pytest "$SUSPECT_FILE" --collect-only -q --no-testmon \
            | grep '::' | sed 's/.*:://' | jq -R . | jq -cs .)"
          echo "tests=${tests_json}" >> "$GITHUB_OUTPUT"
          echo "本轮逐个用例跑 $(printf '%s' "$tests_json" | jq length) 个："
          printf '%s' "$tests_json" | jq -r '.[]' | sed 's/^/  /'

  probe:
    needs: plan
    name: ${{ matrix.test }}
    # 单个用例正常是毫秒级；给 6 分钟，挂住的会被 job 超时收掉并显示 cancelled，
    # 那就是答案本身。
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.plan.outputs.tests) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - run: uv sync --all-extras --all-groups --frozen

      - name: Run ${{ matrix.test }}
        run: |
          set +e
          timeout --signal=KILL 120 \
            uv run pytest "${SUSPECT_FILE}::${{ matrix.test }}" -q --no-testmon --timeout=60 \
            > /tmp/one.log 2>&1
          rc=$?
          set -e

          echo "rc=${rc}（137 = 撞到 120 秒被杀）"
          tail -40 /tmp/one.log

          # 孙进程比父进程晚一点才出现在 ps 里，沉降一下再探。
          # 泄漏特征取自本文件里那个故意留下管道成员的回归测试：
          # `bash -lc "... sleep 30 | tee /dev/null"`。
          sleep 2
          leftover="$(ps -eo pid,pgid,sess,etime,args 2>/dev/null \
            | grep -E 'sleep [0-9]|tee /dev/null|bash -lc' | grep -v grep || true)"
          if [ -n "$leftover" ]; then
            echo "==== 本用例跑完后仍有残留进程 ===="
            printf '%s\n' "$leftover"
          else
            echo "==== 无残留进程 ===="
          fi
          exit "$rc"
