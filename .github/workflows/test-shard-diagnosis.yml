# 一次性诊断用。结论确认后删掉本文件。
#
# 四轮收敛（每轮都靠"让 job 本身承载信号"，不依赖能否从挂住的 run 里抠日志）：
#   1. 8 个连续分片 → 只有 shard 6（排序后第 76-90 个文件）挂住；
#   2. 15 个文件塞进一个 job → 我限了单文件却没限总和，step 跑满 30 分钟被取消（失败的一轮）；
#   3. 一个文件一个 job → 14 个全绿，只有 tests/test_process_runner.py 挂住；
#   4. 一个用例一个 job → 41 个全绿，只有
#      test_process_watchdog_includes_context_label_in_logs 挂住。
#
# 该用例给 watchdog 传的是 MagicMock，超时分支会走到
# `_terminate_process_tree(mock_process)`：`mock.pid` 不是整数，而 `os.getpgid()`
# 会对参数调 `__index__`，MagicMock 的 `__index__` 默认返回 **1** ——
# 于是 `os.getpgid(1)` 拿到 1 号进程组，守卫只比较"是不是自己的组"（1 != 自己），
# 放行，最终对 **1 号进程组**发 SIGKILL。
#
# macOS 上这一步被 PermissionError 兜住，测试靠权限不足侥幸通过。
# 本 job 在真实 runner 上探测同一条链路，全程只用信号 0（纯权限探测，不发真信号），
# 用来确认 Linux runner 上这个 killpg 是否会被放行——若放行，杀掉的就是 runner
# 自己的进程树，这正好解释"runner 失联 + 日志永远 BlobNotFound"。
name: Test shard diagnosis (manual)

on:
  workflow_dispatch:

jobs:
  probe-killpg:
    name: probe killpg(1) permission
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Probe
        run: |
          python - <<'PY'
          import os
          import signal
          from unittest.mock import MagicMock

          mock_process = MagicMock()
          print("uid =", os.getuid(), " pid =", os.getpid())
          print("MagicMock().pid.__index__() =", mock_process.pid.__index__())

          child_group_id = os.getpgid(mock_process.pid)
          own_group_id = os.getpgid(0)
          print("os.getpgid(mock.pid) =", child_group_id)
          print("os.getpgid(0)        =", own_group_id)
          print("守卫放行 killpg      =", child_group_id != own_group_id)

          # 只发信号 0：内核照常做权限检查但不投递信号。
          try:
              os.killpg(child_group_id, 0)
              print(">>> killpg(%d, 0) 被允许 —— 真跑时这里是 SIGKILL，"
                    "会杀掉该组全部可杀进程" % child_group_id)
          except OSError as probe_error:
              print(">>> killpg(%d, 0) 被拒绝: %r" % (child_group_id, probe_error))

          print("--- 1 号进程组里都有谁 ---")
          PY
          ps -eo pid,pgid,user,args | awk 'NR==1 || $2==1' | head -20
