# 一次性诊断用。第一阶段（8 个连续分片并行跑）已经出结论：只有 shard 6 挂住，
# 嫌疑范围是排序后第 76-90 个测试文件；而且它连 `timeout` 的整组 SIGKILL 都熬过去了
# ——泄漏进程在独立会话里（runner 用 start_new_session 单独建组），整组信号够不着。
#
# 第二阶段要拿到点名证据，关键是**让步骤必定结束**：
# 把 pytest 的输出重定向到文件而不是管道，孙进程就没有 step 的 stdout 可握，
# 之前五次取证失败（BlobNotFound）的根因也就不存在了。
# 逐个文件跑，每个前后比一次残留进程，谁泄漏一目了然。
#
# 定位后删掉本文件。
name: Test shard diagnosis (manual)

on:
  workflow_dispatch:

jobs:
  leak-hunt:
    name: leak hunt (files 76-90)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - run: uv sync --all-extras --all-groups --frozen

      - name: Hunt the leaker
        run: |
          # 泄漏特征取自 test_process_runner.py 里那个故意留下管道成员的回归测试：
          # `bash -lc "... sleep 30 | tee /dev/null"`。只认这几个名字，避开 runner 自身噪声。
          # 排除自己所在的进程组和 1 号组：下面要按 PGID 整组回收，而
          # `kill -9 -- -1` 是"杀掉所有进程"的特殊语义，匹配到自己就是自尽。
          self_pgid="$(ps -o pgid= -p $$ | tr -d ' ')"
          leak_probe() {
            ps -eo pid,pgid,sess,etime,args 2>/dev/null \
              | grep -E 'sleep [0-9]|tee /dev/null|bash -lc' \
              | grep -v grep \
              | awk -v self="$self_pgid" '$2 != self && $2 > 1' || true
          }

          files="$(ls tests/test_*.py | sort | sed -n '76,90p')"
          echo "本轮逐个跑 $(printf '%s\n' "$files" | wc -l) 个文件"
          echo

          suspects=""
          for f in $files; do
            # 重定向到文件，不用管道：孙进程继承的是 fd 指向的文件，握不住 step 的 stdout。
            # 所以无论测试怎么挂，timeout 到点后这一步都会继续往下走。
            timeout --signal=KILL 180 \
              uv run pytest "$f" -q --no-testmon --timeout=60 > /tmp/one.log 2>&1
            rc=$?

            # 沉降一下再探：孙进程（sleep / tee）比父进程晚一点才出现在 ps 里，
            # 探早了只抓到 `bash -lc` 一行，看不出它到底握着什么。
            sleep 1
            leftover="$(leak_probe)"
            tag=""
            [ "$rc" -eq 137 ] && tag=" ⟵ 超时被杀"
            [ -n "$leftover" ] && tag="${tag} ⟵ 留下了进程"
            printf '%-52s rc=%-4s%s\n' "$f" "$rc" "$tag"

            if [ "$rc" -ne 0 ] || [ -n "$leftover" ]; then
              suspects="${suspects}${f}"$'\n'
              echo "  ---- 末尾输出 ----"
              tail -15 /tmp/one.log | sed 's/^/  /'
              if [ -n "$leftover" ]; then
                echo "  ---- 残留进程 ----"
                printf '%s\n' "$leftover" | sed 's/^/  /'
                # 收掉再跑下一个，避免污染后续判定。只回收探针抓到的那几个进程组
                # （ps 的第 2 列是 PGID）——不要用 `pkill -f 'sleep [0-9]'` 这种宽匹配，
                # runner 自己也在用 sleep，会连它一起杀掉。
                printf '%s\n' "$leftover" | awk '{print $2}' | sort -u \
                  | while read -r pgid; do kill -9 -- "-${pgid}" 2>/dev/null || true; done
              fi
              echo
            fi
          done

          echo
          echo "================ 结论 ================"
          if [ -z "$suspects" ]; then
            echo "逐个文件跑全部干净 —— 说明挂住来自文件之间的相互作用，"
            echo "而不是单个文件；下一步要按相邻组合复现。"
          else
            printf '嫌疑文件：\n%s' "$suspects"
          fi
