# 上游模板自带的"模板脚手架归档"发布流程：跑 scripts/shared/release.py 打出
# dist/*.zip 并发 GitHub release。keda 是模板的**消费方**而不是模板本身，这个
# 归档在这里没有意义。
#
# 更要命的是它原本挂在 `push: tags: v*` 上，和 release.yml 撞同一批 tag：
#   1. 两者共用 concurrency group `release-${{ github.ref }}`，会互相排队
#      （v0.2.0 首次打 tag 时 release.yml 就被它挡成 pending）；
#   2. 它的 "Publish GitHub release" 步骤**不带 draft: true**，会直接发布。
#      而 release.yml 监听 `release: published` 去上传 PyPI —— 等于绕过
#      "人工检查 draft 产物后再发布" 这道唯一的人工闸门，让不可逆的 PyPI
#      上传自动发生。
# 此前它一直因为 max-file-lines 那步失败而没走到发布，属于误打误撞的保险；
# 那步修好后隐患才暴露出来。
#
# 因此在 keda 摘掉 tag 触发，只保留手动 dispatch（真要打模板归档时再说）。
# 发布链路的唯一入口是 release.yml。
name: Template Archive (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: template-archive-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  build-release:
    # 见 ci.yml 同名设置：job 级超时由服务端执行，runner 卡死时仍有效。
    timeout-minutes: 25
    name: Build Release Archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies from lock file
        run: uv sync --all-extras --all-groups --frozen

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Check max file lines (hard limit)
        # 与 ci.yml 同一套调用：白名单存在才传，写法与上游模板一致。
        # 两个 workflow 都跑这个检查，改其一必须改另一个——本仓曾只修 ci.yml
        # 导致 tag 触发的本 workflow 仍以同样原因失败。
        run: |
          allow_list_file=hooks/max_file_lines.allowlist.txt
          allow_list_args=()
          if [ -f "$allow_list_file" ]; then
            allow_list_args=(--allow-list-file "$allow_list_file")
            echo "using allow-list: $allow_list_file"
          fi
          uv run python hooks/shared/check_max_file_lines.py \
            --max-lines 1000 --glob "*.py" src/backend "${allow_list_args[@]}"

      # timeout-minutes 是诊断也是防护。基线：2026-07-28 的 eb75be4 用同一条命令
      # 跑完 1773 个测试只要 45 秒；2026-09-11 起同一步骤 25 分钟不结束——因为
      # 此前 max-file-lines 一直先失败、本步一直被 skip，某个在 CI 里会挂住的
      # 东西就这样藏了一个多月。挂住的套件应该快速失败并**保留日志**（超时会保留，
      # 取消不会），`-v` 输出里最后一个测试就是嫌疑人。
      #
      # --no-testmon 与本地 `just test all` 一致：CI 是全新 checkout，testmon 的
      # 增量选择零收益。注意它不是上面那个慢的原因（45 秒那次 testmon 也开着），
      # 只是顺手去掉无谓开销。这处是**有意的下游分歧**，不要回流上游：上游
      # pytest.ini 的 addopts 是 `-m '...' -n auto --dist=loadgroup`，套用会砍掉
      # 它的 xdist 并行。
      - name: Run local test suite
        timeout-minutes: 12
        # --timeout 是这里唯一真正能拿到证据的机制。前两次尝试都失败了：
        # step 级 timeout-minutes 归 runner 进程管，runner 卡死时一起失效；
        # job 级 timeout-minutes 由服务端执行、确实会回收，但产生的 conclusion
        # 是 **cancelled**，而**取消的 job 日志一律不落盘**（实测两次都只拿到
        # BlobNotFound）。pytest-timeout 不依赖 GitHub 的任何超时：挂住的用例
        # 以 traceback 失败并点名，整个 run 正常结束，日志自然保留。
        # 120 秒对单个用例极宽松——整套在本地只要 71 秒。
        run: uv run pytest tests/ -v -m "not expensive" --no-testmon --durations=25 --timeout=120

      - name: Build documentation
        run: uv run mkdocs build --strict

      - name: Build template release archive
        run: uv run python scripts/shared/release.py

      - name: Locate release archive
        id: release_archive
        run: |
          shopt -s nullglob
          release_archives=(dist/*.zip)
          if [ "${#release_archives[@]}" -ne 1 ]; then
            echo "Expected exactly one release archive, found ${#release_archives[@]}."
            exit 1
          fi
          echo "release_archive_path=${release_archives[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: template-release-${{ github.run_id }}
          path: ${{ steps.release_archive.outputs.release_archive_path }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.release_archive.outputs.release_archive_path }}
          generate_release_notes: true

      - name: Publish workflow summary
        run: |
          {
            echo "### Template release workflow"
            echo ""
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Archive: \`${{ steps.release_archive.outputs.release_archive_path }}\`"
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              echo "- GitHub Release: published"
            else
              echo "- GitHub Release: skipped for manual workflow dispatch"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
