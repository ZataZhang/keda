name: Release

# 发布两步走（见 docs/guides/release-process.md）：
#   1. 推送 v* tag → build job 构建产物并创建 DRAFT release（此时 PyPI 无任何变化，可反悔）
#   2. 人工检查 draft release 产物后正式发布 → release published 事件触发
#      publish-pypi（Trusted Publishing 上传）与 update-tap（tap formula 自动更新）
# PyPI 版本号一旦上传就永久占用，因此上传绝不能挂在 tag 事件上。
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (defaults to the trigger ref)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & upload sdist + wheel
    # 只响应 tag push。release published 事件跑 publish-pypi / update-tap；
    # workflow_dispatch 是 update-tap 的补救入口，此时 GITHUB_REF 是
    # refs/heads/main 而非 tag，action-gh-release 会去找名为 refs/heads/main
    # 的 release 然后重试到超时（v0.2.0 补救时实测如此，无副作用但噪音大）。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Sync dependencies from lock file
        run: uv sync --all-extras --all-groups --frozen

      # Console 静态产物不入库（见 .gitignore），发布时先构建前端再打 wheel。
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build frontend-public static export
        run: |
          pnpm --filter frontend-public install --frozen-lockfile
          pnpm --filter frontend-public build

      - name: Copy static export into package data
        run: |
          rm -rf src/backend/api/static/console
          cp -R frontend-public/out src/backend/api/static/console

      - name: Build sdist + wheel
        run: uv build

      - name: Verify distributions bundle the console assets
        run: |
          if ! python -m zipfile -l dist/*.whl | grep -q "backend/api/static/console/index.html"; then
            echo "wheel must contain the bundled console static export"
            exit 1
          fi
          if ! tar -tzf dist/*.tar.gz | grep -q "backend/api/static/console/index.html"; then
            echo "sdist must contain the bundled console static export"
            exit 1
          fi

      - name: Verify distributions omit bundled skills
        run: |
          if python -m zipfile -l dist/*.whl | grep -qE "agent_runner/skills/(prd|code-reviewer)/SKILL.md"; then
            echo "wheel must not contain bundled skills"
            exit 1
          fi
          if tar -tzf dist/*.tar.gz | grep -qE "agent_runner/skills/(prd|code-reviewer)/SKILL.md"; then
            echo "sdist must not contain bundled skills"
            exit 1
          fi

      - name: Compute SHA256SUMS
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum kedacode-*.tar.gz kedacode-*.whl > SHA256SUMS
          else
            shasum -a 256 kedacode-*.tar.gz kedacode-*.whl > SHA256SUMS
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
          files: |
            dist/kedacode-*.tar.gz
            dist/kedacode-*.whl
            dist/SHA256SUMS

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing)
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # environment 名必须与 PyPI Trusted Publishing 登记逐字一致（登记值为 pypi）。
    # 仓库内不存任何长期发布凭据：PyPI 侧凭据由 GitHub OIDC 短期签发（PRD FR-3）。
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download reviewed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 只上传该 release 里人工检查过的产物，而不是重新构建
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.tar.gz' --pattern '*.whl' --dir dist
          ls -l dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 同版本重复上传按幂等成功处理（PyPI 会拒绝重复文件，视为已发布）
          skip-existing: true

  update-tap:
    name: Update Homebrew tap formula
    # 也允许手动触发：PyPI 已上传但 tap 更新失败是可恢复状态，不该逼人重新
    # 发布一次 release 才能补救（重跑旧 run 用的是旧 workflow 文件，改了不生效）。
    #
    # 必须写 always()：手动触发时 publish-pypi 会被自身的 if 跳过，而不带状态
    # 函数的自定义 if 仍隐含要求 needs 成功，skipped 不算成功，本 job 会被一起
    # 跳掉。加 always() 后改由下面的条件自己判定：release 路径要求 publish-pypi
    # 确实成功，手动路径不看它。
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'release' && needs.publish-pypi.result == 'success'))
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAP_REPO: ZataZhang/homebrew-tap
    steps:
      - name: Require tap token secret
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::Secret HOMEBREW_TAP_TOKEN 未配置。需要一枚仅对 ${TAP_REPO} contents 有写权限的细粒度 PAT，登记步骤见 docs/guides/release-process.md。"
            exit 1
          fi

      - name: Set up Homebrew
        # 用 @main 而不是 @master：上游 2026-09-13 前后删掉了 master 分支
        # （仓库里留着一个 `remove-master-sync` 分支为证），默认分支已是 main。
        # 0.2.0 发布时 @master 还能解析，0.2.1 发布时就报
        # `Unable to resolve action Homebrew/actions@master`，整个 update-tap
        # 在 Set up job 阶段就挂掉——注意这发生在任何步骤跑起来之前。
        uses: Homebrew/actions/setup-homebrew@main

      - name: Resolve published version
        # release 事件下 GITHUB_REF_NAME 就是 tag；手动触发时取 inputs.tag，
        # 没给则回落到 PyPI 上的最新版本（补救场景通常就是补最新那次）。
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            resolved_version="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.tag }}" ]; then
            resolved_version="$(echo "${{ inputs.tag }}" | sed 's/^v//')"
          else
            resolved_version="$(curl -fsSL https://pypi.org/pypi/kedacode/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])')"
          fi
          echo "resolved version: ${resolved_version}"
          echo "KEDACODE_VERSION=${resolved_version}" >> "$GITHUB_ENV"

      - name: Clone tap repository (first run creates main on the empty repo)
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" "${RUNNER_TEMP}/tap" 2>"${RUNNER_TEMP}/clone.log"; then
            echo "cloned existing tap repository"
          else
            cat "${RUNNER_TEMP}/clone.log"
            mkdir -p "${RUNNER_TEMP}/tap"
            git -C "${RUNNER_TEMP}/tap" init -b main
            git -C "${RUNNER_TEMP}/tap" remote add origin "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git"
            echo "empty tap repository detected; initialized local main for the first push"
          fi

      - name: Bootstrap formula skeleton when missing
        run: |
          mkdir -p "${RUNNER_TEMP}/tap/Formula"
          if [ ! -f "${RUNNER_TEMP}/tap/Formula/kedacode.rb" ]; then
          cd "${RUNNER_TEMP}/tap"
          # heredoc 正文必须顶格（Python 对缩进敏感），PY 结束符同理
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          package_name = "kedacode"
          package_version = os.environ["KEDACODE_VERSION"]
          metadata_url = f"https://pypi.org/pypi/{package_name}/{package_version}/json"
          payload = json.load(urllib.request.urlopen(metadata_url))
          sdist = next(u for u in payload["urls"] if u["packagetype"] == "sdist")
          sdist_url = sdist["url"]
          sdist_sha256 = sdist["digests"]["sha256"]
          lines = [
              "class Kedacode < Formula",
              "  include Language::Python::Virtualenv",
              "",
              '  desc "Issue Agent Runner (iar): turn GitHub Issues into a local AI agent queue"',
              '  homepage "https://github.com/ZataZhang/keda"',
              f'  url "{sdist_url}"',
              f'  sha256 "{sdist_sha256}"',
              '  license "Apache-2.0"',
              "",
              '  depends_on "python@3.12"',
              # Homebrew 的 Python formula 一律从 sdist 源码构建，而依赖树里有
              # Rust 扩展（pydantic-core 经 pydantic-settings -> pydantic 引入，
              # 无法避免）。不声明这条，用户机器上没有 Rust 时 brew install 会在
              # 构建 pydantic-core 时失败；声明后 Homebrew 会自行准备 Rust。
              # update-python-resources 只重写 resource 块，本行会被保留。
              '  depends_on "rust" => :build',
              "",
              "  def install",
              "    virtualenv_install_with_resources",
              '    bin.install_symlink libexec/"bin/iar"',
              # kedacode 是 iar 的同功能别名（见 pyproject [project.scripts]）。
              '    bin.install_symlink libexec/"bin/kedacode"',
              "  end",
              "",
              "  test do",
              '    assert_match version.to_s, shell_output("#{bin}/iar --version")',
              '    assert_match version.to_s, shell_output("#{bin}/kedacode --version")',
              "  end",
              "end",
          ]
          formula_path = pathlib.Path("Formula/kedacode.rb")
          formula_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          echo "bootstrapped Formula/kedacode.rb skeleton from PyPI metadata"
          fi

      # brew tap <user/repo> <path> 是 git clone：没有任何 commit 的空仓库克隆不出
      # 工作树，首次运行会拿不到 formula。先在本地落一个种子 commit。
      - name: Seed an initial commit so the tap is clonable
        run: |
          cd "${RUNNER_TEMP}/tap"
          if ! git rev-parse HEAD >/dev/null 2>&1; then
            git -c user.name="keda-release-bot" \
                -c user.email="actions@users.noreply.github.com" \
                add Formula/kedacode.rb
            git -c user.name="keda-release-bot" \
                -c user.email="actions@users.noreply.github.com" \
                commit -m "seed kedacode formula skeleton"
            echo "seeded initial commit for the empty tap repository"
          fi

      - name: Regenerate Python resources from PyPI
        run: |
          # update-python-resources 会重写 formula 的 resource 块；
          # 要求 kedacode 及其全部依赖在 PyPI 上有 sdist（PRD 7.5 第 7 条）。
          # 注意 brew tap 是 clone：改写发生在 Homebrew 自己的 tap 目录里，
          # 必须把结果拷回 ${RUNNER_TEMP}/tap，否则推出去的 formula 没有任何
          # resource —— 用户装得上但一跑就崩（PRD rv-3 要防的正是这个）。
          # --ignore-main-package-cooldown：Homebrew 默认只认上传超过 24 小时的
          # 包（--uploaded-prior-to=P1D 供应链防护），而这个 job 恰恰在发布后
          # 几分钟内跑，必然解析不到 kedacode 自己。该开关只对 formula 自身放行，
          # 依赖仍受 cooldown 保护；对自建 tap 有效（仅 official tap 会忽略它）。
          # Homebrew 6.x 起，第三方 tap 的 formula 默认不可加载：
          #   Refusing to load formula ... from untrusted tap
          # 两个坑都踩过，别再改回去：
          # 1. 必须放在 brew tap **之前**——这道检查发生在 tap 自身（clone 完就逐个
          #    校验 formula，失败信息是 `Cannot tap ...: invalid syntax in tap!`），
          #    放到 tap 之后压根轮不到执行；
          # 2. 必须用 --formula 而不是 --tap——Homebrew 的报错把两条都列了出来，
          #    但 tap 级信任不被这条加载路径采纳（本地 Homebrew 6.0.22 实测：
          #    `Trusted tap: zatazhang/tap` 打印成功后 brew tap 照样拒绝；
          #    换成 --formula 后立刻 `Tapped 1 formula`）。
          # 信任的是本项目自己的 formula，不是第三方来源。
          brew trust --formula ZataZhang/tap/kedacode
          brew tap ZataZhang/tap "${RUNNER_TEMP}/tap"
          brew update-python-resources --ignore-main-package-cooldown ZataZhang/tap/kedacode
          brew_tap_dir="$(brew --repository ZataZhang/tap)"
          cp "${brew_tap_dir}/Formula/kedacode.rb" "${RUNNER_TEMP}/tap/Formula/kedacode.rb"

      - name: Verify the formula declares its dependencies
        run: |
          # Homebrew 用 pip --no-deps 安装，漏 resource 的表现是"装得上、一跑就崩"，
          # 且 job 会静默变绿。这里硬性拦住：没有 resource 块就不许推。
          formula_file="${RUNNER_TEMP}/tap/Formula/kedacode.rb"
          resource_count="$(grep -c '^  resource "' "$formula_file" || true)"
          echo "formula declares ${resource_count} resource block(s)"
          if [ "${resource_count}" -lt 1 ]; then
            echo "::error::Formula/kedacode.rb 没有任何 resource 块——update-python-resources 的结果没有回写到待推送的工作树。拒绝推送一个装上就崩的 formula。"
            exit 1
          fi

      - name: Ensure tap README records the resource generator
        # 只在 README 缺失时写入骨架，不覆盖 tap 仓库里手工维护的版本。
        run: |
          readme_file="${RUNNER_TEMP}/tap/README.md"
          if [ ! -f "$readme_file" ]; then
            cat > "$readme_file" <<'EOF'
          # ZataZhang/homebrew-tap

          `kedacode` 的 Homebrew formula（命令名 `iar`），由 keda 仓库的 release 流水线自动更新。

          - 安装：`brew install ZataZhang/tap/kedacode`（**必须写全限定名**：Homebrew 6.0 起
            第三方 tap 需显式信任，全限定名安装会顺带只信任该 formula；写成 `brew tap` + 短名
            会撞上"tap 未受信任、formula 被忽略"）
          - **这里是源码构建，约 8 分钟**：预编译 bottle 只有 homebrew-core 才有，自建 tap 没有。
            依赖树含 Rust 扩展（`pydantic-core`），formula 声明了 `depends_on "rust" => :build`，
            Homebrew 会顺带装约 400MB 的 Rust 工具链；还需要可用的 Xcode Command Line Tools。
            想快请走 `uv tool install kedacode`（预编译 wheel，几秒，三平台通吃）。
          - `Formula/kedacode.rb` 的 resource 块由 `brew update-python-resources` 自动生成
            （要求包及全部依赖在 PyPI 上有 sdist），**请勿手工编辑**；`depends_on` 等非 resource
            行是手工维护的，该工具不会动。
          - 补救入口：PyPI 已发布但 tap 没跟上时，在 keda 仓库手动触发 `release.yml`
            （`gh workflow run release.yml -f tag=vX.Y.Z`），不需要重新发版。
          EOF
          fi

      - name: Commit and push formula update
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git -C "${RUNNER_TEMP}/tap" add Formula/kedacode.rb README.md
          if git -C "${RUNNER_TEMP}/tap" diff --cached --quiet; then
            echo "tap formula already up to date for ${KEDACODE_VERSION}"
            exit 0
          fi
          git -C "${RUNNER_TEMP}/tap" \
            -c user.name="keda-release-bot" \
            -c user.email="actions@users.noreply.github.com" \
            commit -m "kedacode ${KEDACODE_VERSION}"
          # HEAD:main 同时覆盖"空仓库首推建分支"与"已有内容更新"两条路径
          git -C "${RUNNER_TEMP}/tap" push origin HEAD:main
