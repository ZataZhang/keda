name: Preview Cleanup

# 一次性清理入口，用完即删。
#
# 背景：teardown 长期静默空转（引用 preview 环境的 secret 却没声明 environment，
# 守卫条件因此恒为假、拆栈步骤被跳过，而 job 照样报绿——见 #132），所以服务器上
# 积压了历史预览栈。更麻烦的是 sticky 评论不可信：更新评论的步骤是 `if: always()`，
# 即便拆栈被跳过也会把评论改成「已拆除」，无法据此枚举残留。
#
# 因此这里不猜 PR 号，而是直接读服务器上的真实状态并清理。keda 自身的预览部署
# 下线后，本文件与预览 CI 一并删除；它刻意不进 templates/preview/，也就不受
# check-template-drift 的字节一致性约束。

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "输入 delete 确认清理所有预览栈"
        required: true
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    name: Remove every preview stack
    runs-on: ubuntu-latest
    # 拆栈需要 SERVER_* ——它们只存在于 preview 环境，不声明就会静默读到空字符串。
    environment: preview
    if: ${{ github.event.inputs.confirm == 'delete' }}
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --all-extras --all-groups --frozen

      - name: Derive stack root and prefix
        id: layout
        run: |
          # 用哨兵 PR 号 0 让 preview_env.py 吐出一套真实布局，再把结尾的 "0" 剥掉，
          # 得到目录根与栈名前缀。这样根目录/命名规则仍由 config.toml 单点决定，
          # 不在此处重复硬编码。
          preview_env_output=$(uv run python scripts/preview_env.py --pr 0 --sha 0000000)
          eval "$preview_env_output"

          app_dir_root="$(dirname "${APP_DIR}")"
          stack_prefix="${COMPOSE_PROJECT_NAME%0}"

          if [ -z "${stack_prefix}" ] || [ "${stack_prefix}" = "/" ] || [ "${app_dir_root}" = "/" ]; then
            echo "ERROR: refusing to run with prefix='${stack_prefix}' root='${app_dir_root}'" >&2
            exit 1
          fi

          echo "app_dir_root=${app_dir_root}" >> "$GITHUB_OUTPUT"
          echo "stack_prefix=${stack_prefix}" >> "$GITHUB_OUTPUT"
          echo "Will remove stacks under ${app_dir_root} named ${stack_prefix}*"

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.SERVER_SSH_KEY }}
          log-public-key: false

      - name: Inventory and remove preview stacks
        env:
          APP_DIR_ROOT: ${{ steps.layout.outputs.app_dir_root }}
          STACK_PREFIX: ${{ steps.layout.outputs.stack_prefix }}
        run: |
          ssh -o StrictHostKeyChecking=no "${SERVER_USER}@${SERVER_HOST}" \
            "APP_DIR_ROOT='${APP_DIR_ROOT}' STACK_PREFIX='${STACK_PREFIX}' bash -s" <<'REMOTE'
          set -uo pipefail

          # 前缀为空会让下面每一条 filter 退化成「匹配全部」，那会波及同机的其他
          # 项目和 Traefik 自身。宁可不做事也不能误删。
          if [ -z "${STACK_PREFIX}" ]; then
            echo "ERROR: STACK_PREFIX is empty, refusing to touch anything." >&2
            exit 1
          fi

          echo "===== BEFORE ====="
          echo "--- stack directories ---"
          ls -1d "${APP_DIR_ROOT}/${STACK_PREFIX}"* 2>/dev/null || echo "(none)"
          echo "--- containers ---"
          docker ps -a --filter "name=^${STACK_PREFIX}" --format '{{.Names}}\t{{.Status}}' || true
          echo "--- volumes ---"
          docker volume ls --filter "name=^${STACK_PREFIX}" --format '{{.Name}}' || true

          echo
          echo "===== REMOVING ====="
          for stack_dir in "${APP_DIR_ROOT}/${STACK_PREFIX}"*; do
            [ -d "${stack_dir}" ] || continue
            stack_name="$(basename "${stack_dir}")"
            echo "----- ${stack_name} -----"
            # 优先复用栈自带的脚本：它知道 compose 文件与 -v 语义，且已有测试覆盖。
            if [ -f "${stack_dir}/deploy-preview.sh" ]; then
              (cd "${stack_dir}" && APP_DIR="${stack_dir}" COMPOSE_PROJECT_NAME="${stack_name}" \
                bash deploy-preview.sh down) || echo "  (script teardown failed, falling back)"
            fi
            rm -rf "${stack_dir}"
          done

          # 兜底：历史栈可能没有脚本、或目录已被手工删掉而容器还在。按前缀锚定清理，
          # 不会波及其他项目。
          echo
          echo "===== SWEEP ====="
          leftover_containers="$(docker ps -a --filter "name=^${STACK_PREFIX}" --format '{{.Names}}')"
          if [ -n "${leftover_containers}" ]; then
            echo "${leftover_containers}" | xargs -r docker rm -f || true
          fi
          leftover_volumes="$(docker volume ls --filter "name=^${STACK_PREFIX}" --format '{{.Name}}')"
          if [ -n "${leftover_volumes}" ]; then
            echo "${leftover_volumes}" | xargs -r docker volume rm -f || true
          fi
          leftover_networks="$(docker network ls --filter "name=^${STACK_PREFIX}" --format '{{.Name}}')"
          if [ -n "${leftover_networks}" ]; then
            echo "${leftover_networks}" | xargs -r docker network rm || true
          fi
          docker image prune -f || true

          echo
          echo "===== AFTER ====="
          echo "--- stack directories ---"
          ls -1d "${APP_DIR_ROOT}/${STACK_PREFIX}"* 2>/dev/null || echo "(none)"
          echo "--- containers ---"
          docker ps -a --filter "name=^${STACK_PREFIX}" --format '{{.Names}}\t{{.Status}}' || true
          echo "--- volumes ---"
          docker volume ls --filter "name=^${STACK_PREFIX}" --format '{{.Name}}' || true
          echo "--- other projects left untouched (sanity check) ---"
          ls -1d "${APP_DIR_ROOT}"/* 2>/dev/null || echo "(preview root is empty)"
          REMOTE
