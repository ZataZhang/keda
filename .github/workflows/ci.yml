name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  frontend-build:
    name: Frontend Build (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - frontend-admin
          - frontend-public
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: ${{ matrix.project }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        # frontend-admin 的 `build` 已自带 `tsc -b`；frontend-public 有独立
        # `typecheck` 脚本。用 --if-present 让缺失脚本时无声跳过，且不破坏
        # 矩阵中已有 typecheck 的项目。
        run: pnpm run --if-present typecheck

      - name: Build
        run: pnpm run build

  validate-template:
    # job 级超时，不是步骤级。两者由不同的东西执行：步骤超时归 runner
    # 进程管，runner 自己卡死时它跟着失效——v0.2.0 之后实测步骤超时
    # 设 12 分钟、步骤却跑了 27 分钟没被杀就是这个原因。job 超时由
    # GitHub 服务端强制执行，能回收卡死的 runner 并把日志刷出来，
    # 这是拿到"到底卡在哪个测试"证据的唯一可靠途径。
    timeout-minutes: 60
    name: Validate Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies from lock file
        run: uv sync --all-extras --all-groups --frozen

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Check max file lines (hard limit)
        # 模板硬门禁:新文件 / 修改文件非空行 ≤ 1000。存量超额文件落在
        # hooks/max_file_lines.allowlist.txt 中,只产生 WARNING。清零进度由
        # tasks/pending/P1-REFACTOR-20260705-210702-file-line-split-seven-files.md 推动。
        #
        # 白名单刻意放在项目自有的 hooks/ 而非上游维护的 hooks/shared/:放后者
        # 会被模板同步用上游内容覆盖掉本仓的豁免条目。写法与上游模板一致,
        # 将来同步过来是零差异。
        run: |
          allow_list_file=hooks/max_file_lines.allowlist.txt
          allow_list_args=()
          if [ -f "$allow_list_file" ]; then
            allow_list_args=(--allow-list-file "$allow_list_file")
            echo "using allow-list: $allow_list_file"
          fi
          uv run python hooks/shared/check_max_file_lines.py \
            --max-lines 1000 --glob "*.py" src/backend "${allow_list_args[@]}"

      # timeout-minutes 是诊断也是防护。基线：2026-07-28 的 eb75be4 用同一条命令
      # 跑完 1773 个测试只要 45 秒；2026-09-11 起同一步骤 25 分钟不结束——因为
      # 此前 max-file-lines 一直先失败、本步一直被 skip，某个在 CI 里会挂住的
      # 东西就这样藏了一个多月。挂住的套件应该快速失败并**保留日志**（超时会保留，
      # 取消不会），`-v` 输出里最后一个测试就是嫌疑人。
      #
      # --no-testmon 与本地 `just test all` 一致：CI 是全新 checkout，testmon 的
      # 增量选择零收益。注意它不是上面那个慢的原因（45 秒那次 testmon 也开着），
      # 只是顺手去掉无谓开销。这处是**有意的下游分歧**，不要回流上游：上游
      # pytest.ini 的 addopts 是 `-m '...' -n auto --dist=loadgroup`，套用会砍掉
      # 它的 xdist 并行。
      - name: Run local test suite
        timeout-minutes: 12
        # --timeout 是这里唯一真正能拿到证据的机制。前两次尝试都失败了：
        # step 级 timeout-minutes 归 runner 进程管，runner 卡死时一起失效；
        # job 级 timeout-minutes 由服务端执行、确实会回收，但产生的 conclusion
        # 是 **cancelled**，而**取消的 job 日志一律不落盘**（实测两次都只拿到
        # BlobNotFound）。pytest-timeout 不依赖 GitHub 的任何超时：挂住的用例
        # 以 traceback 失败并点名，整个 run 正常结束，日志自然保留。
        # 120 秒对单个用例极宽松——整套在本地只要 71 秒。
        run: |
          set -o pipefail
          uv run pytest tests/ -v -m "not expensive" --no-testmon \
            --durations=25 --timeout=120 2>&1 | tee /tmp/pytest.log

      # if: always() 在取消时也会执行，而 artifact 的上传不依赖 job 日志是否落盘。
      # 这是四次尝试后唯一还没被证伪的取证路径：step 超时归 runner 管（runner 卡死
      # 时失效）、job 超时产生 cancelled（日志不落盘）、手动取消同理——三种情况
      # 拿到的都是 2 行 BlobNotFound。
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.run_id }}
          path: /tmp/pytest.log
          if-no-files-found: warn
          # 默认 90 天保留会累积吃满账户 Actions 存储配额；retention-days
          # 仅作 prune 步骤失败时的兜底。
          retention-days: 7

      - name: Prune old pytest-log artifacts (keep latest 3)
        if: always()
        # 数量封顶：无论 CI 频率多高，同前缀制品只保留最新 3 份。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | select(.expired==false) | select(.name | startswith("pytest-log-")) | "\(.created_at)\t\(.id)"' \
            | sort -r | tail -n +4 | cut -f2 \
            | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"

      - name: Build documentation
        run: uv run mkdocs build --strict

      - name: Build template release archive
        run: uv run python scripts/shared/release.py

      - name: Locate release archive
        id: release_archive
        run: |
          shopt -s nullglob
          release_archives=(dist/*.zip)
          if [ "${#release_archives[@]}" -ne 1 ]; then
            echo "Expected exactly one release archive, found ${#release_archives[@]}."
            exit 1
          fi
          echo "release_archive_path=${release_archives[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload release smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: template-release-${{ github.sha }}
          path: ${{ steps.release_archive.outputs.release_archive_path }}
          if-no-files-found: error
          # 默认 90 天保留会累积吃满账户 Actions 存储配额；retention-days
          # 仅作 prune 步骤失败时的兜底。
          retention-days: 7

      - name: Prune old template-release artifacts (keep latest 3)
        # 数量封顶：无论 CI 频率多高，同前缀制品只保留最新 3 份。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | select(.expired==false) | select(.name | startswith("template-release-")) | "\(.created_at)\t\(.id)"' \
            | sort -r | tail -n +4 | cut -f2 \
            | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"
