name: Install smoke

# 两个维度（PRD FR-9，实现期修订：发布触发改挂 release published 后，
# tag 事件只产出 draft、PyPI 无变化，故"从 PyPI 真实安装"档挂在 release published）：
#   1. install-check：install.sh 计划检查 + 可编辑安装（install.sh 是 bash 脚本，Windows 不适用）
#   2. real-install：真实安装 + iar console 启动探活——
#      PR / 分支 / tag 事件从本次构建的 wheel 装；release published 事件从公共 PyPI 装
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install-check:
    name: install.sh plan + editable install on ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    env:
      KEDA_REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Run install.sh --check (local)
        run: bash install.sh --check

      - name: Install kedacode from local checkout (editable + reinstall)
        run: |
          uv tool install --reinstall --editable .
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # 两个 console script 都要验：漏掉别名时 pyproject 的 [project.scripts]
          # 改动不会在这里冒烟出来。
          iar --version
          kedacode --version

      - name: Exercise iar init in a throwaway git repo
        run: |
          tmp_repo="$(mktemp -d)"
          git -C "$tmp_repo" init -q
          git -C "$tmp_repo" checkout -q -b main
          git -C "$tmp_repo" config user.email "smoke@example.com"
          git -C "$tmp_repo" config user.name "Install Smoke"
          user_skills_dir="$tmp_repo/user-skills"
          cd "$tmp_repo"
          CC_SWITCH_SKILLS_DIR="$user_skills_dir" iar init --dry-run
          CC_SWITCH_SKILLS_DIR="$user_skills_dir" iar init
          test -f "$tmp_repo/.iar.toml"
          test -f "$user_skills_dir/prd/SKILL.md"
          test -f "$user_skills_dir/code-reviewer/SKILL.md"
          test ! -e "$tmp_repo/.claude/skills"
          test ! -e "$tmp_repo/.codex/skills"
          test ! -e "$tmp_repo/.kimi-code/skills"
          CC_SWITCH_SKILLS_DIR="$user_skills_dir" iar init  # second run updates only user-level skills

      - name: "Optional: install from raw GitHub URL (release tag only)"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl --max-time 60 -fsSL \
            "https://raw.githubusercontent.com/${KEDA_REPO}/${GITHUB_REF_NAME}/install.sh" \
            -o /tmp/install.sh
          bash /tmp/install.sh --check

  build-wheel:
    name: Build wheel with bundled console assets
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Sync dependencies from lock file
        run: uv sync --all-extras --all-groups --frozen

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build frontend-public static export
        run: |
          pnpm --filter frontend-public install --frozen-lockfile
          pnpm --filter frontend-public build

      - name: Copy static export into package data
        run: |
          rm -rf src/backend/api/static/console
          cp -R frontend-public/out src/backend/api/static/console

      - name: Build wheel
        run: uv build --wheel

      - name: Verify wheel bundles the console assets
        run: |
          if ! python -m zipfile -l dist/*.whl | grep -q "backend/api/static/console/index.html"; then
            echo "wheel must contain the bundled console static export"
            exit 1
          fi

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kedacode-wheel
          path: dist/*.whl
          if-no-files-found: error

  real-install:
    name: Real install + console probe on ${{ matrix.os }}
    needs: build-wheel
    if: github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Download built wheel
        uses: actions/download-artifact@v4
        with:
          name: kedacode-wheel
          path: dist

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install from built wheel (real install, not --check)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uv tool install --reinstall dist/*.whl
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          iar --version
          kedacode --version

      - name: Install from built wheel (real install, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel_path = (Get-ChildItem "dist/*.whl" | Select-Object -First 1).FullName
          if (-not $wheel_path) { throw "no wheel found under dist/" }
          uv tool install --reinstall $wheel_path
          Add-Content $env:GITHUB_PATH (Join-Path $env:USERPROFILE ".local/bin")
          iar --version
          kedacode --version

      - name: Probe iar console (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          probe_dir="$(mktemp -d)"
          cd "$probe_dir"
          iar console --no-browser --port 8611 &
          console_pid=$!
          trap 'kill "$console_pid" 2>/dev/null || true' EXIT
          http_code=""
          for _ in $(seq 1 30); do
            sleep 2
            http_code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8611/ || true)"
            if [ "$http_code" = "200" ]; then
              echo "iar console returned 200"
              exit 0
            fi
          done
          echo "iar console did not return 200 within 60s (last code: ${http_code:-none})"
          exit 1

      - name: Probe iar console (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $probe_dir = Join-Path $env:RUNNER_TEMP "iar-console-probe"
          New-Item -ItemType Directory -Force -Path $probe_dir | Out-Null
          Set-Location $probe_dir
          $console_proc = Start-Process -FilePath "iar" `
            -ArgumentList "console", "--no-browser", "--port", "8611" `
            -PassThru -NoNewWindow
          $probe_ok = $false
          try {
            foreach ($attempt in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8611/" `
                  -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -eq 200) {
                  Write-Host "iar console returned 200"
                  $probe_ok = $true
                  break
                }
              } catch {
                # 服务尚未就绪，继续等待
              }
            }
            if (-not $probe_ok) {
              throw "iar console did not return 200 within 60s"
            }
          } finally {
            if (-not $console_proc.HasExited) {
              Stop-Process -Id $console_proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

  post-publish-smoke:
    name: Install from public PyPI + console probe on ${{ matrix.os }}
    # release 正式发布后从公共索引真实安装（PRD rv-1 的 CI 级证据收集器）
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # 本 job 和 release.yml 的 publish-pypi 由同一个 release: published 事件
      # 触发，分属两个 workflow、没有顺序保证——v0.2.0 实测本 job 03:19:00 启动、
      # 上传约 03:20 才完成，于是三个平台全部 404。即便加了顺序依赖，PyPI 上传
      # 后索引也有秒级传播延迟。所以这里先有界轮询等版本出现，再安装。
      - name: Wait for the version to appear on PyPI
        if: runner.os != 'Windows'
        shell: bash
        env:
          PUBLISHED_VERSION: ${{ github.event.release.tag_name }}
        run: |
          package_version="${PUBLISHED_VERSION#v}"
          for attempt in $(seq 1 40); do
            if curl -fsS -o /dev/null "https://pypi.org/pypi/kedacode/${package_version}/json"; then
              echo "kedacode ${package_version} is on PyPI (attempt ${attempt})"
              exit 0
            fi
            sleep 15
          done
          echo "::error::kedacode ${package_version} 在 10 分钟内没有出现在 PyPI 上；先查 release.yml 的 publish-pypi job。"
          exit 1

      - name: Install kedacode from public PyPI (pinned to the published version)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PUBLISHED_VERSION: ${{ github.event.release.tag_name }}
        run: |
          package_version="${PUBLISHED_VERSION#v}"
          # 固定到刚发布的版本号：公共索引上不存在该版本时本步直接失败
          uv tool install --reinstall "kedacode==${package_version}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          iar --version
          kedacode --version

      # Windows 档同样要等（原因见上方非 Windows 档的注释）。
      - name: Wait for the version to appear on PyPI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PUBLISHED_VERSION: ${{ github.event.release.tag_name }}
        run: |
          $package_version = $env:PUBLISHED_VERSION -replace '^v', ''
          for ($attempt = 1; $attempt -le 40; $attempt++) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri "https://pypi.org/pypi/kedacode/$package_version/json" -TimeoutSec 15 | Out-Null
              Write-Host "kedacode $package_version is on PyPI (attempt $attempt)"
              exit 0
            } catch {
              Start-Sleep -Seconds 15
            }
          }
          Write-Host "::error::kedacode $package_version did not appear on PyPI within 10 minutes; check publish-pypi in release.yml."
          exit 1

      - name: Install kedacode from public PyPI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PUBLISHED_VERSION: ${{ github.event.release.tag_name }}
        run: |
          $package_version = $env:PUBLISHED_VERSION -replace '^v', ''
          uv tool install --reinstall "kedacode==$package_version"
          Add-Content $env:GITHUB_PATH (Join-Path $env:USERPROFILE ".local/bin")
          iar --version
          kedacode --version

      - name: Probe iar console (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          probe_dir="$(mktemp -d)"
          cd "$probe_dir"
          iar console --no-browser --port 8612 &
          console_pid=$!
          trap 'kill "$console_pid" 2>/dev/null || true' EXIT
          http_code=""
          for _ in $(seq 1 30); do
            sleep 2
            http_code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8612/ || true)"
            if [ "$http_code" = "200" ]; then
              echo "iar console returned 200"
              exit 0
            fi
          done
          echo "iar console did not return 200 within 60s (last code: ${http_code:-none})"
          exit 1

      - name: Probe iar console (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $probe_dir = Join-Path $env:RUNNER_TEMP "iar-console-probe"
          New-Item -ItemType Directory -Force -Path $probe_dir | Out-Null
          Set-Location $probe_dir
          $console_proc = Start-Process -FilePath "iar" `
            -ArgumentList "console", "--no-browser", "--port", "8612" `
            -PassThru -NoNewWindow
          $probe_ok = $false
          try {
            foreach ($attempt in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8612/" `
                  -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -eq 200) {
                  Write-Host "iar console returned 200"
                  $probe_ok = $true
                  break
                }
              } catch {
                # 服务尚未就绪，继续等待
              }
            }
            if (-not $probe_ok) {
              throw "iar console did not return 200 within 60s"
            }
          } finally {
            if (-not $console_proc.HasExited) {
              Stop-Process -Id $console_proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

  # install.sh 曾在 bootstrap uv 之前就用 ambient python3 做硬性版本门禁，于是
  # README 顶部那条一键安装命令在原装 macOS（自带 3.9.x）上必然失败。CI 之所以
  # 一直没暴露：上面几档都先跑 actions/setup-python，把"用户机器上可能没有新
  # Python"这个前提掩盖了。本档刻意装一个低于 3.11 的解释器来复现真实场景。
  stock-python:
    name: install.sh with a too-old ambient python3 on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 用 3.10 而非 macOS 真实的 3.9.6：走的是同一条 `< 3.11` 分支，而 3.10 在
      # setup-python 的各平台上都稳定可得。
      - name: Set up a deliberately old Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Confirm the ambient python3 is below the minimum
        run: |
          python3 -V
          if python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)'; then
            echo "::error::本档需要一个低于 3.11 的 ambient python3，实际是 $(python3 -V)；档位失去意义，请修 matrix。"
            exit 1
          fi

      - name: install.sh --check must succeed and fall back to uv
        run: |
          plan="$(bash install.sh --check --source pypi 2>&1)"
          echo "$plan"
          if ! printf '%s' "$plan" | grep -qE "method: *uv"; then
            echo "::error::ambient python 过旧时 install.sh 应自动选 uv（uv 自带解释器），实际计划不是 uv。"
            exit 1
          fi

      - name: install.sh --method pip must fail loudly, not silently
        run: |
          if bash install.sh --check --source pypi --method pip >/dev/null 2>&1; then
            echo "::error::--method pip 直接使用 ambient 解释器，python 过旧时必须报错退出。"
            exit 1
          fi
          echo "--method pip correctly refused the too-old interpreter"

      - name: Real install from PyPI with the old ambient python
        run: |
          bash install.sh --source pypi --method uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Probe the installed console
        run: |
          iar --version
          iar console --no-browser --port 8899 &
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null "http://127.0.0.1:8899/api/v1/agent-runner/health"; then
              echo "console reachable with a 3.10 ambient python"
              exit 0
            fi
            sleep 3
          done
          echo "::error::console 未在 60 秒内就绪。"
          exit 1
