id: keda-history-expanded-v1
version: 1.8.0
title: Keda 历史扩展评测集
repo_path: .
base_ref: main
rubric:
  id: default-rubric
  version: v1
check:
  timeout_seconds: 240
cases:
- id: deliberation-failure-isolation
  prompt: Keep the historical iar deliberate command running after a participant fails.
    Preserve its partial output, finish the other participants and synthesis, and
    use the existing profile with a different registered agent if the injected fallback
    resolver supplies one. The failure and fallback must appear in the result and
    session.json failed_agents entries, including profile, original agent, fallback
    agent if any, and reason. Fallback selection should be automatic in noninteractive
    runs and offer a bounded choice in a terminal. A failed synthesizer with no fallback
    should leave an empty synthesis while preserving other outputs. The default command
    returns success when some work finishes; --strict returns nonzero for any failure,
    and an entirely failed run also returns nonzero. Support the existing deliberation
    settings layout with continue_on_agent_error defaulting to true and agent_failure_timeout_seconds
    defaulting to 300. Keep old callers compatible. CLI roles can select registered
    agents, and Kimi must be invoked without the unsupported --quiet flag.
  check_recipe: uv-pytest
  base_ref: f5e2c96b807f75a199b5951ed58470f07a3dee33
  split: dev
  check_targets:
  - tests/test_eval_deliberation_cli_failures.py
  held_out:
  - tests/test_eval_deliberation_cli_failures.py
  - tests/keda_eval_historical_cli.py
  candidate_hidden:
  - tasks/pending/P1-BUG-20260622-162748-deliberation-agent-failure-resilience.md
  gold_patch: gold.patch
- id: tty-repl-entry
  prompt: Make bare iar open the conversational REPL in a terminal. Bare iar in a
    pipe or script should show help and exit nonzero without a traceback. Preserve
    named subcommands, accept explicit REPL agent selections but reject auto, and
    require an initialized repository for REPL operations. The same terminal flow
    must also be available through the named iar repl command. The user can select
    claude, codex, or kimi. An explicit auto selection must never be passed to a REPL
    runtime.
  check_recipe: uv-pytest
  base_ref: be393620b55cf30de3160414ee0107241c672d1c
  split: dev
  check_targets:
  - tests/test_eval_tty_cli.py::test_no_terminal_shows_help_without_traceback
