- id: evidence-check-cli
  prompt: Add a local kc evidence check command to re-run a worktree's evidence manifest
    with the same parser, per-command timeout ceiling and stdout-assertion semantics
    as the delivery gate. Run every valid item and report all failures, including
    the expected assertion and closest output line. A timed-out item must not stop
    later items. If the manifest is invalid, execute nothing. The explicit evidence
    directory wins, a unique default candidate can be selected, and multiple candidates
    are a usage error. Support machine-readable JSON and exit codes 0 for success,
    1 for failed evidence, and 2 for invalid CLI usage including a timeout above the
    configured ceiling. Keep delivery-gate pass criteria and legacy manifests compatible.
    The gate must also aggregate all failing items. Synchronize the packaged operator
    skill and runner evidence guidance. The CLI is exercised in an initialized Git
    checkout. No specific spelling for the explicit evidence-directory option or JSON
    field layout is required; discoverable options and machine-readable per-item outcomes
    must express the stated behaviors.
  check_recipe: uv-pytest
