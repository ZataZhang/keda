- id: structured-evidence-opt-in
  prompt: When an Issue is created from a PRD that requires Realistic Validation,
    its generated body must opt the Issue into structured evidence. An Issue with
    no validation checklist must retain its previous behavior. Existing Issues without
    the opt-in must remain compatible with legacy evidence. Generate a version-1 iar:structured-evidence
    HTML comment with the configured language. Honor an explicit opt-out requested
    when constructing an Issue from a PRD.
  check_recipe: uv-pytest
  base_ref: cd9b843d5c7bb3465f354c2b9d82ed32e6082133
