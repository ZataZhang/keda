- id: issue-log-resume-and-isolation
  prompt: 'Expose visible execution output for one registered repository and Issue,
    including single-Issue foreground runs. Persist independent attempts as logs/agent-runner/issues/<repo_id>/issue-<number>-<timestamp>.log.
    The installed iar logs command must support --issue N and --lines N, show the
    last N data lines by default, work without --follow, and return an empty success
    for a missing Issue attempt without reading other logs. Explicit --issue and --kind
    are mutually exclusive.


    The Console GET route is /api/v1/agent-runner/console/repositories/{repo_id}/issues/{issue_number}/logs.
    Read starting at byte offset 0 unless offset is supplied or tail=true is requested.
    Support attempt_id, offset, max_bytes, and tail=true. Return repo_id, issue_number,
    content, next_offset, eof, attempt_id, latest_attempt_id and a status of ok, no_attempt,
    attempt_gone, or truncated. When polling an explicit existing old attempt, retain
    its output while updating latest_attempt_id. When that attempt disappears or the
    offset exceeds the file length, report the corresponding status. An unknown repository
    returns HTTP 404 and a nonpositive Issue number returns HTTP 400.'
  check_recipe: uv-pytest
  base_ref: 5fac043246a261c8a8751faf19b49fb454ebaa34
  split: dev
  check_targets:
  - tests/test_eval_agent_runner_console_api.py::test_issue_log_attempt_switch_and_truncation
