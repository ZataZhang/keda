  - tests/test_eval_agent_runner_console_api.py::test_issue_log_rejects_invalid_issue_number
  - tests/test_eval_agent_runner_console_api.py::test_issue_log_requires_registered_repo
  - tests/test_eval_agent_runner_console_api.py::test_issue_log_tail_window_returns_last_bytes
  - tests/test_eval_agent_runner_console_api.py::test_issue_log_tail_window_with_explicit_attempt
  - tests/test_eval_agent_runner_orchestrate.py::test_run_once_sequential_default_writes_per_issue_logs
  - tests/test_eval_cli_registry.py::test_logs_command_issue_and_kind_are_mutually_exclusive
  - tests/test_eval_cli_registry.py::test_logs_command_issue_no_attempt_is_clean_exit
