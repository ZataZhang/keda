id: keda-history-v1
version: 1.0.0
title: Keda historical backend fixes (M13 seed)
repo_path: .
base_ref: main
rubric:
  id: default-rubric
  version: v1
check:
  timeout_seconds: 240
cases:
- id: supervisor-check-decisions
  prompt: 'After a pull request is sent for review, check summaries sometimes cause
    the supervisor to treat an unrun or pending check as proof that code must be changed
    or that human review cannot proceed. Make the outcome reflect the available facts:
    executed failing jobs may lead to repair, while pending or unrun checks may still
    proceed to human review when local validation is complete, with their state clearly
    disclosed and never described as passing.'
  check_recipe: uv-pytest
  base_ref: f6c51fdc8a58bfab1a21f3dcf28b8d4a80b1498e
  split: dev
  check_targets:
  - tests/test_pr_supervisor.py::test_build_supervisor_prompt_requires_ci_execution_distinction
  - tests/test_pr_supervisor.py::test_supervisor_action_gate_keeps_approval_when_checks_fail
  - tests/test_pr_supervisor.py::test_supervisor_action_gate_keeps_approval_when_checks_pending
  - tests/test_pr_supervisor.py::test_supervisor_action_gate_keeps_approval_when_sign_off_and_other_checks_fail
  - tests/test_pr_supervisor.py::test_supervisor_action_gate_keeps_human_input_for_sign_off_only
  - tests/test_pr_supervisor.py::test_supervisor_loop_keeps_agent_approval_under_failed_checks
  - tests/test_pr_supervisor.py::test_supervisor_loop_keeps_agent_approval_under_pending_checks
  - tests/test_review_once.py::test_review_once_detects_checks_state_change_and_triggers_supervisor
  - tests/test_review_once.py::test_review_once_keeps_agent_approval_under_pending_checks
  held_out:
  - tests/test_pr_supervisor.py
  - tests/test_review_once.py
  candidate_hidden:
  - tasks/pending/P1-BUG-20260924-100212-agent-led-post-pr-ci-decision.md
  - tasks/pending/P1-FEAT-20260916-134008-roadmap-prd-cicd-monitor-auto-repair.md
  gold_patch: gold.patch
- id: captured-process-final-output
  prompt: A captured child process can keep running after a period without output.
    When it finishes, the returned result must contain all text written to standard
    output and error. If a descendant keeps a pipe open after the child exits, collection
    must still finish within a bound. Keep the existing overall timeout, inactivity
    timeout, and cancellation behavior.
  check_recipe: uv-pytest
  base_ref: e17f599a14a243dcdd1e7fefec04aa42674a0655
  split: dev
  check_targets:
  - tests/test_process_runner.py::test_captured_output_includes_stdout_written_when_process_exits
  held_out:
  - tests/test_process_runner.py
  candidate_hidden:
  - tasks/archive/P1-BUG-20260624-194537-agent-execution-timeout-hang.md
  - tasks/archive/P1-FEAT-20260628-041733-realistic-validation-independent-verifier-gate.md
  - tasks/archive/P1-FEAT-20261011-160913-verifier-human-takeover.md
  gold_patch: gold.patch
- id: daemon-safe-logging
  prompt: Logging configuration must tolerate an invalid level without stopping the
    process, rotate date-named files when a long-running process crosses a day boundary,
    clean expired files during rotation, and keep the application's own file handler
    attached when unrelated root handlers already exist. Keep normal settings unchanged
    and make the log-listing fallback agree with the configured log location.
  check_recipe: uv-pytest
  base_ref: f0af2d60c18dc157feb918364552e31bf56d8290
  split: dev
  check_targets:
  - tests/test_cli_registry.py::test_logs_command_fallback_when_log_file_missing
  - tests/test_cli_registry.py::test_logs_command_fallback_when_no_records
  held_out:
  - tests/test_cli_registry.py
  candidate_hidden:
  - tasks/pending/P0-BUG-20260930-145323-logging-config-robustness.md
  gold_patch: gold.patch
- id: idea-local-wall-clock
  prompt: When a person adds an idea without an explicit event time, store the current
    local wall-clock time in the idea entry. Do not store a UTC wall-clock and later
    present it as local time. Preserve an explicitly supplied event time.
  check_recipe: uv-pytest
  base_ref: 155797a1f803a38f510eae6d3d8671fc5b25fc2d
  split: dev
  check_targets:
  - tests/test_idea_inbox.py::test_append_idea_default_stamp_is_local_wall_clock
  held_out:
  - tests/test_idea_inbox.py
  candidate_hidden:
  - docs/guides/idea-inbox.md
  - tasks/archive/P1-FEAT-20260614-203810-frontend-idea-inbox-cross-platform.md
  gold_patch: gold.patch
- id: short-term-memory-records
  prompt: Keep short-term execution history out of a target repository and avoid putting
    full tool transcripts in the compact summary. Preserve enough context for later
    skill distillation to recover the full attempt history; continue reading older
    records, fall back safely when a referenced log is missing or unsafe, and respect
    a configured memory location.
  check_recipe: uv-pytest
  base_ref: d0595887f838686cb21caacd503cf2ffe4310413
  split: dev
  check_targets:
  - tests/test_agent_runner_memory.py::test_short_term_store_keeps_context_compact_and_hydrates_detail_logs
  - tests/test_agent_runner_memory.py::test_short_term_summary_skips_trailing_output_fences
