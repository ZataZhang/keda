  - tasks/archive/P1-FEAT-20260626-093933-agent-runner-memory-persistence.md
  gold_patch: gold.patch
- id: failure-handoff-across-claims
  prompt: When the recovery budget runs out, write a structured Issue handoff using
    the iar:failure-context comment marker. Include the checkpoint commit, failed
    attempts, validation outcome and available evidence. When a later claim continues
    partial work, inject the newest structured Issue handoff into the continuation
    prompt and omit stale handoffs and unrelated comments. If an unpublished code
    checkpoint exists, publish or update a draft PR for that head with a link to the
    Issue handoff, clearly report the validation failure, and leave the Issue blocked
    using the existing state. This exhaustion path may publish while the PRD remains
    pending. Keep the commit and PRD archive requirements for ordinary successful
    publication. If no checkpoint exists, report the exhaustion and leave the Issue
    blocked without creating a draft.
  check_recipe: uv-pytest
  base_ref: 87ab96ee149eae7240f7ecd16eb1de81d7ef4dae
  split: dev
  check_targets:
