cases:
- id: supervisor-check-decisions
  prompt: After a pull request is sent for review, give the supervisor the raw check
    facts and guide it to distinguish completed failures, pending or unrun jobs, and
    insufficient evidence. A concrete executed failure can justify repair. Pending
    or unrun jobs can proceed to human review when local validation and the task requirements
    allow it. The supervisor must disclose unverified remote checks without calling
    them passing. The platform must preserve the supervisor's legal action and summary
    regardless of check rollup or a sole manual sign-off failure, while retaining
    the existing merge conflict guard. Check-state transitions must continue to trigger
    supervisor reevaluation.
  check_recipe: uv-pytest
  base_ref: f6c51fdc8a58bfab1a21f3dcf28b8d4a80b1498e
  split: dev
  check_targets:
  - tests/test_eval_pr_supervisor.py::test_build_supervisor_prompt_requires_ci_execution_distinction
  - tests/test_eval_pr_supervisor.py::test_supervisor_action_gate_keeps_approval_when_checks_fail
  - tests/test_eval_pr_supervisor.py::test_supervisor_action_gate_keeps_approval_when_checks_pending
  - tests/test_eval_pr_supervisor.py::test_supervisor_action_gate_keeps_approval_when_sign_off_and_other_checks_fail
  - tests/test_eval_pr_supervisor.py::test_supervisor_action_gate_keeps_human_input_for_sign_off_only
  - tests/test_eval_pr_supervisor.py::test_supervisor_loop_keeps_agent_approval_under_failed_checks
  - tests/test_eval_pr_supervisor.py::test_supervisor_loop_keeps_agent_approval_under_pending_checks
  - tests/test_eval_review_once.py::test_review_once_detects_checks_state_change_and_triggers_supervisor
  - tests/test_eval_review_once.py::test_review_once_keeps_agent_approval_under_pending_checks
  held_out:
  - tests/test_eval_pr_supervisor.py
  - tests/test_eval_review_once.py
  candidate_hidden:
  - tasks/pending/P1-BUG-20260924-100212-agent-led-post-pr-ci-decision.md
  - tasks/pending/P1-FEAT-20260916-134008-roadmap-prd-cicd-monitor-auto-repair.md
  gold_patch: gold.patch
- id: captured-process-final-output
  prompt: A captured child process can keep running after a period without output.
    When it finishes, the returned result must contain all text written to standard
    output and error. After the direct child exits, descendants retaining those pipes
    must not keep capture waiting beyond the existing five-second drain allowance.
    Preserve overall timeout, inactivity timeout, and cancellation behavior.
  check_recipe: uv-pytest
  base_ref: e17f599a14a243dcdd1e7fefec04aa42674a0655
  split: dev
  check_targets:
  - tests/test_eval_process_runner.py::test_captured_output_includes_stdout_written_when_process_exits
  - tests/test_eval_process_runner.py::test_captured_output_returns_when_descendant_keeps_pipes_open
  held_out:
  - tests/test_eval_process_runner.py
  candidate_hidden:
