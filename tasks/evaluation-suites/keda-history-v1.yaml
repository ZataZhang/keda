- id: short-term-memory-records
  prompt: Keep default short-term execution history outside the target repository
    and honor explicit memory locations. Keep stored summaries and attempt details
    at most 240 characters, without trailing stdout or stderr labels and fenced transcripts.
    Store full attempt and final-solution text as separate logs under the issue's
    attempt-details directory. Reuse the same log when those texts are identical.
    The JSON record should point to them with per-attempt detail_log_path and final_solution_log_path,
    and loading should hydrate the full text. Keep older inline records readable and
    use compact values when a log is missing or an unsafe path would escape the issue's
    memory directory.
  check_recipe: uv-pytest
  base_ref: d0595887f838686cb21caacd503cf2ffe4310413
  split: dev
  check_targets:
  - tests/test_eval_agent_runner_memory.py::test_short_term_store_keeps_context_compact_and_hydrates_detail_logs
