  - tasks/archive/P1-FEAT-20260626-093933-agent-runner-memory-persistence.md
  gold_patch: gold.patch
- id: failure-handoff-across-claims
  prompt: When recovery continues in a later claim, retain the most recent useful
    failure context so work does not restart from a snapshot without an explanation.
    If recovery is exhausted, leave a reviewable outcome that accurately reports the
    failure and available validation state; do not make unfinished work look complete.
  check_recipe: uv-pytest
  base_ref: 87ab96ee149eae7240f7ecd16eb1de81d7ef4dae
  split: dev
  check_targets:
  - tests/test_agent_runner_checkpoint.py::test_next_claim_reflows_latest_handoff_record_into_continuation_prompt
  - tests/test_agent_runner_publish.py::test_require_prd_archived_false_appears_only_on_the_exhaustion_path
  - tests/test_agent_runner_run_once.py::test_run_once_no_new_commits_fails
  - tests/test_agent_runner_run_once_commit.py::test_run_once_uncommitted_changes_missing_request_fails
  held_out:
