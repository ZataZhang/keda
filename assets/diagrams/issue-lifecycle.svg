<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1620" viewBox="0 0 1150 1620" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1150" height="1620" fill="#ffffff"/>
  <text x="575" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">KedaCode · Open Issue 认领后的执行链</text>

  <!-- entry -->
  <rect x="360" y="54" width="380" height="44" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="550" y="82" text-anchor="middle" font-size="14" font-weight="650" fill="#166534">open Issue · daemon 轮询认领（claim 选举）</text>

  <!-- ===== band 1: triage ===== -->
  <text x="60" y="130" font-size="13" font-weight="700" fill="#334155">① 分诊：Issue 形态与标签决定走向</text>
  <path d="M480,98 C420,112 260,120 220,150" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M550,98 L550,150" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M620,98 C690,112 850,122 900,150" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="60" y="150" width="320" height="118" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.2"/>
  <text x="220" y="172" text-anchor="middle" font-size="13.5" font-weight="650" fill="#6b21a8">agent/deliberate · 复杂需求</text>
  <text x="76" y="194" font-size="11.5" fill="#475569">Phase 0 异步讨论：AI 贴结构化澄清清单</text>
  <text x="76" y="212" font-size="11.5" fill="#475569">（范围/约束/验收/选型/风险）↔ 人回复，多轮</text>
  <text x="76" y="230" font-size="11.5" fill="#475569">收敛完全由人触发：手动换 agent/rework-prd</text>
  <text x="76" y="248" font-size="11.5" fill="#94a3b8">AI 不自动判定讨论结束</text>

  <rect x="420" y="150" width="330" height="140" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
  <text x="585" y="172" text-anchor="middle" font-size="13.5" font-weight="650" fill="#075985">agent/rework-prd · 生成/重写 PRD</text>
  <text x="436" y="194" font-size="11.5" fill="#475569">一次性读 Issue 体 + 全部评论 → PRD 落到</text>
  <text x="436" y="212" font-size="11.5" fill="#475569">tasks/pending/；body 写回 PRD path 锚点；</text>
  <text x="436" y="230" font-size="11.5" fill="#475569">摘 rework-prd · 加 source/prd · 可选 +agent/ready</text>
  <text x="436" y="252" font-size="11.5" fill="#b45309">PRD 人审：Human-Confirmed 空框留人；</text>
  <text x="436" y="270" font-size="11.5" fill="#b45309">执行侧未勾项阻塞提交（CHECKLIST_UNCHECKED）</text>

  <rect x="800" y="150" width="310" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="955" y="172" text-anchor="middle" font-size="13.5" font-weight="650" fill="#0f172a">无 PRD 轻量 / 已关联 PRD</text>
  <text x="816" y="194" font-size="11.5" fill="#475569">轻量：按 Issue body 直接实现，</text>
  <text x="816" y="212" font-size="11.5" fill="#475569">不新增 PR body 契约要求</text>
  <text x="816" y="230" font-size="11.5" fill="#475569">已关联：body 的 PRD path 锚点 →</text>
  <text x="816" y="248" font-size="11.5" fill="#475569">实现 prompt 内联 PRD 全文（≤20k 字符）</text>

  <!-- converge to running -->
  <path d="M220,268 C220,330 290,368 336,390" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M585,290 C585,330 562,374 544,392" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M955,250 C955,320 640,386 514,392" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="600" y="360" font-size="11" fill="#64748b">PRD 就绪后（agent/ready 或定向 run）</text>
  <path d="M380,164 L420,164" fill="none" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="322" y="150" font-size="10.5" fill="#9333ea">收敛后人换标签</text>

  <!-- ===== band 2: implementation ===== -->
  <text x="60" y="380" font-size="13" font-weight="700" fill="#334155">② 统一实现段</text>
  <rect x="180" y="392" width="380" height="44" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="370" y="420" text-anchor="middle" font-size="14" font-weight="650" fill="#854d0e">agent/running · 建 worktree issue-N</text>

  <line x1="370" y1="436" x2="370" y2="464" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="464" width="380" height="50" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="370" y="486" text-anchor="middle" font-size="14" font-weight="650" fill="#0f172a">实现 agent 写代码</text>
  <text x="370" y="505" text-anchor="middle" font-size="11.5" fill="#64748b">fallback：claude → kimi → codex · 最多重试 5 次</text>

  <line x1="370" y1="514" x2="370" y2="542" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="542" width="380" height="50" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="370" y="564" text-anchor="middle" font-size="14" font-weight="650" fill="#0f172a">提交前验证（仓库自己的 verification_commands）</text>
  <text x="370" y="583" text-anchor="middle" font-size="11.5" fill="#64748b">失败 → Fix Agent（跟随实现者）修复循环</text>

  <rect x="610" y="542" width="240" height="50" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="730" y="563" text-anchor="middle" font-size="12.5" font-weight="650" fill="#991b1b">agent/failed / agent/blocked</text>
  <text x="730" y="582" text-anchor="middle" font-size="11" fill="#b91c1c">kc recover / kc blocked-continue</text>
  <path d="M560,567 L610,567" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowred)"/>

  <!-- ===== band 3: release tiers ===== -->
  <text x="60" y="640" font-size="13" font-weight="700" fill="#334155">③ builder 提交后的发布档位（三选一 · 互斥）</text>
  <path d="M300,592 C280,616 240,626 225,654" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M370,592 C380,620 560,626 590,654" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M480,592 C520,616 880,626 950,654" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="60" y="654" width="330" height="196" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="225" y="678" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">默认档（最严）</text>
  <text x="76" y="702" font-size="11.5" fill="#475569">1. rv re-exec：复跑 PRD 声明的验证命令</text>
  <text x="76" y="722" font-size="11.5" fill="#475569">2. verifier 对抗复验（挑 ≠ 实现者的 agent）</text>
  <text x="76" y="742" font-size="11.5" fill="#475569">3. pre-PR review 门禁（≠实现者优先）</text>
  <text x="76" y="762" font-size="11.5" fill="#475569">4. 创建 Draft PR（body 含 Closes #N）</text>
  <text x="76" y="782" font-size="11.5" fill="#475569">5. post-PR supervisor 审查</text>
  <text x="76" y="806" font-size="11" fill="#94a3b8">有 PRD 时走 PR-Native Acceptance 交付契约</text>

  <rect x="430" y="654" width="330" height="196" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="595" y="678" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">--fast-merge（run 一次性旗标）</text>
  <text x="446" y="702" font-size="11.5" fill="#475569">✗ 跳过 rv re-exec 与独立 verifier</text>
  <text x="446" y="722" font-size="11.5" fill="#475569">✓ pre-PR review / supervisor / 仓库验证照常</text>
  <text x="446" y="742" font-size="11.5" fill="#475569">PR 正文显式标注「未经自动化验证」</text>
  <text x="446" y="766" font-size="11.5" fill="#b45309">与 direct-pr 互斥：同给=用法错误（exit 2），</text>
  <text x="446" y="784" font-size="11.5" fill="#b45309">刻意不「取更强者」</text>

  <rect x="800" y="654" width="310" height="196" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3"/>
  <text x="955" y="678" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9a3412">direct-pr（仅无 PRD 的 Issue）</text>
  <text x="816" y="702" font-size="11.5" fill="#475569">✗ rv re-exec + verifier</text>
  <text x="816" y="722" font-size="11.5" fill="#475569">✗ pre-PR review + 仓库验证命令</text>
  <text x="816" y="742" font-size="11.5" fill="#475569">✗ post-PR supervisor</text>
  <text x="816" y="762" font-size="11.5" fill="#475569">→ builder 提交后直发 Draft PR</text>
  <text x="816" y="782" font-size="11.5" fill="#475569">DIRECT marker 自我声明 · 质量门 = PR 的 CI</text>
  <text x="816" y="806" font-size="11" fill="#94a3b8">标签/旗标在发布确认后被认领者消费删除</text>

  <!-- converge to supervising -->
  <path d="M225,850 C225,900 320,906 370,930" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M595,850 L595,930" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M955,850 C955,900 830,908 760,930" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- ===== band 4: merge & closeout ===== -->
  <text x="60" y="916" font-size="13" font-weight="700" fill="#334155">④ 合并与收尾</text>
  <rect x="290" y="930" width="560" height="44" rx="10" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="570" y="958" text-anchor="middle" font-size="14" font-weight="650" fill="#075985">agent/supervising · Draft PR 已创建（默认档含 supervisor 审查）</text>

  <line x1="570" y1="974" x2="570" y2="1000" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="290" y="1000" width="560" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="570" y="1028" text-anchor="middle" font-size="14" font-weight="650" fill="#1e40af">agent/review · 等人工 review</text>

  <line x1="570" y1="1044" x2="570" y2="1072" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="290" y="1072" width="560" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="570" y="1094" text-anchor="middle" font-size="13.5" font-weight="650" fill="#0f172a">merge：人工合并；或 autopilot 合并队列（需 autopilot.enabled + safety.auto_merge）</text>
  <text x="570" y="1114" text-anchor="middle" font-size="11.5" fill="#64748b">verifier 门 → 自动签核 sign-off → rebase → 全量验证 → 禁改路径终扫</text>

  <line x1="570" y1="1128" x2="570" y2="1156" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="1156" width="280" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="1178" text-anchor="middle" font-size="13.5" font-weight="650" fill="#166534">issue 关闭（Closes #N）</text>
  <text x="320" y="1198" text-anchor="middle" font-size="11" fill="#64748b">auto_merge=false 时由人点合并</text>
  <line x1="460" y1="1182" x2="524" y2="1182" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="524" y="1156" width="460" height="52" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="754" y="1178" text-anchor="middle" font-size="13.5" font-weight="650" fill="#0f172a">有 PRD 时：runner 归档 PRD</text>
  <text x="754" y="1198" text-anchor="middle" font-size="11" fill="#64748b">git mv tasks/pending → archive · Human-Confirmed 空框原样保留给人</text>

  <!-- legend -->
  <rect x="60" y="1268" width="1050" height="120" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="80" y="1296" font-size="12" font-weight="650" fill="#0f172a">图例</text>
  <circle cx="90" cy="1318" r="6" fill="#16a34a"/><text x="104" y="1322" font-size="12" fill="#334155">ready</text>
  <circle cx="180" cy="1318" r="6" fill="#eab308"/><text x="194" y="1322" font-size="12" fill="#334155">running</text>
  <circle cx="290" cy="1318" r="6" fill="#38bdf8"/><text x="304" y="1322" font-size="12" fill="#334155">supervising</text>
  <circle cx="420" cy="1318" r="6" fill="#2563eb"/><text x="434" y="1322" font-size="12" fill="#334155">review</text>
  <circle cx="530" cy="1318" r="6" fill="#dc2626"/><text x="544" y="1322" font-size="12" fill="#334155">failed</text>
  <circle cx="630" cy="1318" r="6" fill="#ea580c"/><text x="644" y="1322" font-size="12" fill="#334155">blocked</text>
  <circle cx="740" cy="1318" r="6" fill="#9333ea"/><text x="754" y="1322" font-size="12" fill="#334155">deliberate / rework-prd（分诊标签）</text>
  <circle cx="1030" cy="1318" r="6" fill="#ea580c"/><text x="1044" y="1322" font-size="12" fill="#334155">direct-pr（档位）</text>
  <text x="80" y="1350" font-size="11.5" fill="#64748b">· 六个 workflow 标签互斥，切换自动清理；direct-pr 是档位标签，发布确认后被认领者消费删除</text>
  <text x="80" y="1370" font-size="11.5" fill="#64748b">· 依赖门禁：上游未满足时 agent/ready 叠加 agent/waiting，跳过领取并评论原因</text>
  <text x="80" y="1390" font-size="11.5" fill="#64748b">· 观察手段：kc logs · kc console · gh pr list · issue 标签流转</text>
</svg>
